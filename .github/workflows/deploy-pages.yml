# Deploys the static frontend build to GitHub Pages on every push.
# This is the zero-setup, free-hosted version of Blas: the full learning
# loop works client-side; the AI Tutor / Azure TTS / pronunciation scoring
# need the backend (see README) and degrade gracefully here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/blas-frontend-backend-split-t84k23]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run frontend tests
        run: npm run test -w frontend

      - name: Build frontend (Pages base path)
        run: npm run build -w frontend
        env:
          BASE_PATH: /langua-/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
